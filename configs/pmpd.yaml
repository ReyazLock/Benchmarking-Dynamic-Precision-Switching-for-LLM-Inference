run_name: pmpd-p8-d73-hb64
output_dir: ../results
repeats: 1
warmup_runs: 2
resource_sample_interval_s: 0.1

workload_ranges:
  - {id: small, min_tokens: 0, max_tokens: 512}
  - {id: medium, min_tokens: 513, max_tokens: 1200}
  - {id: large, min_tokens: 1201}

generation:
  max_new_tokens: 64
  temperature: 0.0
  top_p: 1.0
  seed: 42

models:
  - id: pmpd-p8-d73-hb64
    backend: pmpd
    model: /mnt/d/MingzhiCai/Rayze/Folder/InternationalCourses/WashU/Master_Degree/ANYLLM/any-precision-llm/cache_tinyllama_formal/packed/anyprec-(TinyLlama-1.1B-Chat-v1.0)-w8_orig3-gc1-c4_s100_blk512
    device: cuda
    precision_bits: 7       # high precision; one scheduled run, not six runs
    precisions: [3, 7, 8]  # packed weights available to PMPD
    extra_options:
      scheduler: naive
      prefill_precision: 8
      low_precision: 3
      high_bit_steps: 64

datasets:
  - id: workload_3len
    path: ../datasets/workload_3len_v4.jsonl
    task: qa
    metrics:
      - contains_reference
      - exact_match
      - concise_hit
      - contains_reference_anywhere
      - token_f1
      - empty_answer
    prompt_templates:
      - "Answer with only the final answer. Question: {prompt}"
      - "Solve the following problem carefully, then print only the answer: {prompt}"
