run_name: tinyllama-workload-qa
output_dir: ../results
repeats: 3
warmup_runs: 2

# Inclusive input-token ranges; choose two or three contiguous ranges.
workload_ranges:
  - {id: small, min_tokens: 0, max_tokens: 128}
  - {id: medium, min_tokens: 129, max_tokens: 512}
  - {id: large, min_tokens: 513}

generation:
  max_new_tokens: 64
  temperature: 0.0
  top_p: 1.0
  seed: 42

models:
  - id: tinyllama-anyprecision-w3-w8
    backend: anyprecision
    model: /mnt/d/MingzhiCai/Rayze/Folder/InternationalCourses/WashU/Master_Degree/ANYLLM/any-precision-llm/cache_tinyllama_formal/packed/anyprec-(TinyLlama-1.1B-Chat-v1.0)-w8_orig3-gc1-c4_s100_blk512
    precisions: [4,6,8,7,3,5]
    baseline: false
    device: cuda
    trust_remote_code: false

datasets:
  - id: workload_qa_30
    path: ../datasets/workload_qa_30.jsonl
    task: qa
    max_samples: 30
    metrics: 
      - exact_match
      - contains_reference
      - token_f1
      - rouge_l
    prompt_templates:
      - "Answer with only the final answer. Question: {prompt}"
      - "Question: {prompt}\nGive a concise and accurate answer."
      - "Solve the following problem carefully, then print only the answer: {prompt}"

