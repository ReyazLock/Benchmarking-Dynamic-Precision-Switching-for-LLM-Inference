run_name: ollama-llama32-3b-formal
output_dir: ../results
repeats: 1
warmup_runs: 1
resource_sample_interval_s: 0.1

generation:
  max_new_tokens: 64
  temperature: 0.0
  top_p: 1.0
  seed: 42

# Replace these placeholders with Ollama tags imported from quantized GGUF files
# derived from the SAME base checkpoint. /api/ps will record Ollama's actual
# quantization_level, so a mislabeled tag is visible in the raw results.
models:
  - id: llama-fp16
    backend: ollama
    model: llama3.2:3b-instruct-fp16
    precision_bits: 16
    baseline: true
    base_url: http://172.29.80.1:11434
    keep_alive: 5m
    extra_options:
      num_ctx: 4096
  
  - id: llama32-q3km
    backend: ollama
    model: llama3.2:3b-instruct-q3_K_M
    precision_bits: 3
    base_url: http://172.29.80.1:11434
    keep_alive: 5m
    extra_options:
      num_ctx: 4096
  
  - id: llama32-q4km
    backend: ollama
    model: llama3.2:3b-instruct-q4_K_M
    precision_bits: 4
    base_url: http://172.29.80.1:11434
    keep_alive: 5m
    extra_options:
      num_ctx: 4096

  - id: llama32-q5km
    backend: ollama
    model: llama3.2:3b-instruct-q5_K_M
    precision_bits: 5
    base_url: http://172.29.80.1:11434
    keep_alive: 5m
    extra_options:
      num_ctx: 4096

  - id: llama32-q6k
    backend: ollama
    model: llama3.2:3b-instruct-q6_K
    precision_bits: 6
    base_url: http://172.29.80.1:11434
    keep_alive: 5m
    extra_options:
      num_ctx: 4096

  - id: llama32-q8
    backend: ollama
    model: llama3.2:3b-instruct-q8_0
    precision_bits: 8
    base_url: http://172.29.80.1:11434
    keep_alive: 5m
    extra_options:
      num_ctx: 4096

datasets:
  - id: tiny-qa
    path: ../datasets/tiny_qa.jsonl
    task: qa
    max_samples: 1
    metrics: [exact_match, contains_reference, token_f1, rouge_l]
    prompt_templates:
      - "Answer with only the final answer. Question: {prompt}"
