run_name: anyllm-fp16
output_dir: ../results
repeats: 1
warmup_runs: 2

# Inclusive input-token ranges; choose two or three contiguous ranges.
workload_ranges:
  - {id: small, min_tokens: 0, max_tokens: 512}
  - {id: medium, min_tokens: 513, max_tokens: 1200}
  - {id: large, min_tokens: 1201}

generation:
  max_new_tokens: 64
  temperature: 0.0
  top_p: 1.0
  seed: 42

models:
  - id: tinyllama-anyprecision-fp16
    backend: huggingface
    model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    precision_bits: 16
    baseline: true
    device: cuda
    trust_remote_code: false
    extra_options:
      dtype: float16
      use_fast: false

datasets:
  - id: workload_3len_v4
    path: ../datasets/workload_3len_v4.jsonl
    task: qa
    metrics: 
      - contains_reference
      - exact_match
      - concise_hit
      - contains_reference_anywhere
      - token_f1
    prompt_templates:
      - "Answer with only the final answer. Question: {prompt}"
      - "Solve the following problem carefully, then print only the answer: {prompt}"