[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anyprecision-bench"
version = "0.1.0"
description = "Reproducible INT3-INT8 LLM quantization benchmark for Ollama and Any-Precision LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "psutil>=5.9",
  "requests>=2.31",
]

[project.optional-dependencies]
native = ["torch>=2.1", "transformers>=4.36"]
dev = ["pytest>=8.0"]

[project.scripts]
apbench = "apbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

